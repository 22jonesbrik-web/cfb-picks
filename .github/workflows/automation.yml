name: CFB Picks Automation

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  update-scores:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Update scores and grade final games
        run: curl --fail-with-body --retry 3 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$APP_URL/api/cron/update-scores"
        env:
          APP_URL: ${{ secrets.APP_URL }}

  sunday-maintenance:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: Sync Sunday game slate and update scores
        run: curl --fail-with-body --retry 3 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$APP_URL/api/cron/daily-maintenance"
        env:
          APP_URL: ${{ secrets.APP_URL }}